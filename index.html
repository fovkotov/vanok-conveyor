<!DOCTYPE html>
<html lang="en" data-theme="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanök — belt</title>
<link rel="icon" href="design/stub/favicon.png" type="image/png">
<style>
  :root {
    --bg: #434343;
    --blue: #8CC88C;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --gap: clamp(18px, 2.1vw, 36px);
    --seam-extra: 0px;
    --vv-lift: 0px;
  }
  html[data-theme="1"] {
    --blue: #8A7E59;
    --bg: hsl(303.8182deg 100% 78.4314%);
  }
  html[data-theme="2"] {
    --blue: #E3F4E8;
    --bg: linear-gradient(180deg, #A59D90 0%, #02DD67 100%);
  }
  html[data-theme="3"] {
    --blue: #ffffff;
    --bg: #80a6bc;
  }
  html[data-theme="3"] .chrome .site-credits { color: #ffffff; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg) fixed;
  }
  body {
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--blue);
    font-family: var(--grotesk);
    -webkit-font-smoothing: antialiased;
  }

  .chrome {
    --hk: calc(100vw / 1440);
    --grid-margin: 12px;
    --grid-gutter: 12px;
    --col: calc((100vw - 2 * var(--grid-margin) - 11 * var(--grid-gutter)) / 12);
    --letter-w: calc(6 * var(--col) + 5 * var(--grid-gutter));
    --letter-left: calc(var(--grid-margin) + 6 * (var(--col) + var(--grid-gutter)));
    --wordmark-top: calc(6 * var(--hk));
    position: relative;
    z-index: 5;
    flex: none;
    height: calc(12px + var(--letter-w) * 233 / 702);
    color: var(--blue);
    pointer-events: none;
  }
  .chrome .crosshair,
  .chrome .ig-link,
  .chrome .catalog-entry,
  .chrome .site-credits,
  .chrome .soon { pointer-events: auto; }
  .chrome > * { position: absolute; }
  .chrome p { margin: 0; }
  .chrome img { display: block; max-width: none; }
  .chrome .vanok,
  .chrome .regular,
  .chrome .lettering { display: none; }
  html[data-theme="1"] .chrome .lettering-1,
  html[data-theme="2"] .chrome .lettering-2,
  html[data-theme="3"] .chrome .lettering-3 { display: block; }
  html[data-theme="1"] .chrome .wordmark,
  html[data-theme="2"] .chrome .wordmark,
  html[data-theme="3"] .chrome .wordmark { display: none; }

  .chrome .crosshair,
  .chrome .catalog-entry {
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    cursor: pointer;
  }
  .chrome .crosshair {
    z-index: 9;
    left: calc(11.06 * var(--hk));
    top: calc(11.23 * var(--hk));
    width: calc(21.535 * var(--hk));
    height: calc(21.535 * var(--hk));
    line-height: 0;
  }
  .chrome .crosshair svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .chrome .bio,
  .chrome .soon {
    font-size: calc(14 * var(--hk));
    line-height: normal;
    white-space: nowrap;
  }
  .chrome .bio {
    left: calc(var(--grid-margin) + var(--col) + var(--grid-gutter));
    top: calc(12 * var(--hk));
    line-height: calc(16 * var(--hk));
  }
  .chrome .soon {
    top: calc(12 * var(--hk));
    right: var(--grid-margin);
    color: inherit;
    text-decoration: none;
  }
  .chrome .ig-link,
  .chrome .catalog-entry {
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    line-height: normal;
    text-decoration-line: underline;
    text-decoration-thickness: from-font;
    text-underline-position: from-font;
    white-space: nowrap;
    cursor: pointer;
    top: calc(12 * var(--hk));
    font-size: calc(14 * var(--hk));
  }
  .chrome .ig-link { left: var(--letter-left); }
  .chrome .catalog-entry {
    left: calc(var(--grid-margin) + 9 * (var(--col) + var(--grid-gutter)));
  }
  .chrome .wordmark {
    left: var(--letter-left);
    top: 12px;
    width: var(--letter-w);
    height: calc(var(--letter-w) * 233 / 702);
  }
  .chrome .lettering-1,
  .chrome .lettering-2,
  .chrome .lettering-3 {
    left: var(--letter-left);
    width: var(--letter-w);
  }
  .chrome .lettering-1 {
    top: calc(var(--wordmark-top) + 23px);
    height: calc(var(--letter-w) * 135 / 619);
  }
  .chrome .lettering-2 {
    top: calc(var(--wordmark-top) + 32px);
    height: calc(var(--letter-w) * 82 / 702);
  }
  .chrome .lettering-3 {
    top: calc(var(--wordmark-top) + 12px);
    height: calc(var(--letter-w) * 124 / 702);
  }
  .chrome .site-credits {
    z-index: 4;
    position: fixed;
    right: 12px;
    bottom: 12px;
    margin: 0;
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    font-size: calc(14 * var(--hk));
    line-height: normal;
    text-decoration: none;
    white-space: nowrap;
    writing-mode: vertical-rl;
    cursor: pointer;
    opacity: 0.32;
  }
  .chrome .site-credits .credits-name {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    visibility: hidden;
  }
  @media (hover: hover) {
    .chrome .ig-link,
    .chrome .catalog-entry { transition: opacity 180ms ease; }
    .chrome .ig-link:hover,
    .chrome .catalog-entry:hover { opacity: 0.8; }
    .chrome .site-credits:hover .credits-full { visibility: hidden; }
    .chrome .site-credits:hover .credits-name { visibility: visible; }
  }
  @media (max-width: 440px) {
    .chrome {
      --hk: calc(100vw / 375);
      --wordmark-top: calc(58 * var(--hk) + 24px);
      height: calc(var(--wordmark-top) + 110 * var(--hk));
    }
    .chrome .wordmark,
    .chrome .catalog-entry,
    .chrome .site-credits { display: none; }
    .chrome .vanok,
    .chrome .regular { display: block; }
    html[data-theme="1"] .chrome .vanok,
    html[data-theme="1"] .chrome .regular,
    html[data-theme="2"] .chrome .vanok,
    html[data-theme="2"] .chrome .regular,
    html[data-theme="3"] .chrome .vanok,
    html[data-theme="3"] .chrome .regular { display: none; }
    .chrome .crosshair {
      left: calc(23.231 * var(--hk));
      top: calc(23.231 * var(--hk));
    }
    .chrome .bio {
      left: calc(194 * var(--hk));
      top: calc(16 * var(--hk));
      width: calc(157 * var(--hk));
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
      white-space: normal;
    }
    .chrome .soon {
      position: fixed;
      z-index: 6;
      top: auto;
      right: calc(24 * var(--hk));
      bottom: calc(24 * var(--hk) + var(--vv-lift));
      height: calc(14 * var(--hk));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
    }
    .chrome .ig-link {
      position: fixed;
      z-index: 6;
      left: calc(24 * var(--hk));
      top: auto;
      bottom: calc(24 * var(--hk) + var(--vv-lift));
      height: calc(14 * var(--hk));
      display: flex;
      align-items: center;
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
    }
    .chrome .vanok {
      left: calc(24 * var(--hk));
      top: var(--wordmark-top);
      width: calc(156.387 * var(--hk));
      height: calc(108.538 * var(--hk));
    }
    .chrome .regular {
      left: calc(136.341 * var(--hk));
      top: calc(var(--wordmark-top) + (93.593 - 77) * var(--hk));
      width: calc(214.658 * var(--hk));
      height: calc(90.339 * var(--hk));
    }
    .chrome .lettering-1,
    .chrome .lettering-2,
    .chrome .lettering-3 {
      left: calc(24 * var(--hk));
      top: var(--wordmark-top);
      width: calc(327 * var(--hk));
    }
    .chrome .lettering-1 { height: calc(71.32 * var(--hk)); }
    .chrome .lettering-2 { height: calc(327 * var(--hk) * 82 / 702); }
    .chrome .lettering-3 { height: calc(327 * var(--hk) * 124 / 702); }
  }

  /* Слот под хедером. Высота ленты меняется внутри него, картинки считаются от полного слота. */
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
  }
  .counter {
    position: relative;
    flex: none;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #434343;
    perspective: 1400px;
    perspective-origin: 50% 18%;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .counter.is-grab { cursor: grabbing; }
  .counter.is-grab .good { pointer-events: none; }

  .well {
    position: absolute;
    inset: 0;
    transform: rotateX(var(--tilt, 9deg)) scale(var(--tilt-scale, 1.111));
    transform-origin: 50% 68%;
  }
  .rubber {
    position: absolute;
    inset: 0;
    background-color: #434343;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 14px);
    background-size: 14px 100%;
    background-position: var(--belt-offset, 0px) 0;
  }
  .rubber::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: url("assets/belt-matte.svg") repeat;
    background-position: var(--belt-offset, 0px) 0;
    opacity: .12; mix-blend-mode: soft-light;
  }
  .rubber[data-material="matte"], .rubber[data-material="grain"], .rubber[data-material="worn"] { background-image: none; }
  .rubber[data-material="grain"]::after { background-image: url("assets/belt-grain.svg"); opacity: .32; }
  .rubber[data-material="fine"] {
    background-image: repeating-linear-gradient(90deg, #484848 0 1px, #3e3e3e 1px 2px, #434343 2px 5px);
    background-size: 5px 100%;
  }
  .rubber[data-material="worn"]::after { background-image: url("assets/belt-worn.svg"); opacity: .25; }
  /* Paired light/shadow edges make the original grooves recessed. */
  .counter.has-depth .rubber[data-material="original"] {
    background-image: repeating-linear-gradient(90deg,
      #343434 0px, #393939 1px, #4c4c4c 2px,
      #454545 3px, #434343 5px, #434343 12px, #3e3e3e 14px);
  }
  .counter.has-depth .rubber[data-material="original"]::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(0,0,0,.24) 0%, transparent 20%,
      rgba(255,255,255,.035) 48%, transparent 76%, rgba(0,0,0,.3) 100%);
    box-shadow: inset 0 5px 8px rgba(0,0,0,.35), inset 0 -6px 10px rgba(0,0,0,.45);
  }
  .material-options { border: 0; padding: 0; margin: 14px 0; }
  .material-options legend { margin-bottom: 6px; }
  .material-options label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .material-options input { margin: 2px 0 0; }
  .material-options small { display: block; margin-top: 2px; color: #555; }
  .belt-panel { max-height: calc(100dvh - 32px); overflow-y: auto; }
  .lane {
    position: absolute;
    left: 0;
    right: 0;
    top: 9%;
    bottom: 8%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
  }
  .track {
    display: flex;
    height: 100%;
    will-change: transform;
  }
  .set {
    display: flex;
    align-items: flex-end;
    height: 100%;
    gap: var(--gap);
    padding-right: calc(var(--gap) + var(--seam-extra));
    flex: none;
  }
  .good {
    flex: none;
    height: var(--h);
    aspect-ratio: var(--ratio);
    margin: 0;
    transform: rotate(var(--r));
    transform-origin: 50% 100%;
    background: #0c0c0c;
    box-shadow:
      0 16px 18px rgba(0, 0, 0, 0.42),
      0 2px 0 rgba(0, 0, 0, 0.55);
  }
  .good img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .taxonomy-control {
    position: absolute;
    z-index: 8;
    top: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: calc(100% - 24px);
    padding: 5px;
    color: #d7d7d7;
    background: rgba(28,28,28,.76);
    border: 1px solid rgba(140,200,140,.55);
    font-size: 11px;
    backdrop-filter: blur(8px);
  }
  .taxonomy-title { padding: 0 6px; white-space: nowrap; color: #a9aaa5; }
  .taxonomy-control button {
    padding: 5px 8px;
    border: 1px solid transparent;
    background: transparent;
    color: inherit;
    font: inherit;
    white-space: nowrap;
    cursor: pointer;
  }
  .taxonomy-control button[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }
  .good .project-tag {
    position: absolute;
    z-index: 2;
    left: 0;
    bottom: 0;
    max-width: 100%;
    padding: 5px 7px 4px;
    color: #e6e6e1;
    background: rgba(25,25,25,.78);
    font-size: clamp(9px, .82vw, 12px);
    line-height: 1;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 150ms ease;
  }
  .counter[data-taxonomy="labels"] .good .project-tag { opacity: 1; }
  .chapter-marker {
    position: relative;
    align-self: flex-end;
    flex: none;
    width: clamp(112px, 15vw, 220px);
    height: 34%;
    min-height: 92px;
    margin: 0 2px 1px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 5px;
    padding: 0 10px 8px;
    border-left: 1px solid rgba(140,200,140,.9);
    color: #d7d7d7;
    font-size: clamp(10px, 1.05vw, 14px);
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: .035em;
  }
  .chapter-marker small { color: #969892; font-size: 9px; letter-spacing: .08em; }
  .counter[data-taxonomy="groups"] .chapter-marker { display: flex; }
  .active-project {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    display: none;
    align-items: baseline;
    gap: 9px;
    padding: 8px 12px;
    color: #d7d7d7;
    background: rgba(28,28,28,.8);
    border: 1px solid rgba(140,200,140,.55);
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  .active-project small { color: #969892; font-size: 10px; }
  .counter[data-taxonomy="focus"] .active-project { display: flex; }
  .counter[data-taxonomy="focus"] .good .project-tag { opacity: 0; }
  .lip {
    position: absolute;
    left: 0;
    right: 0;
    height: 8px;
    z-index: 4;
    pointer-events: none;
    background: #666;
    border-top: 1px solid #888;
    border-bottom: 1px solid #333;
  }
  .lip.top { top: 0; }
  .lip.bottom { bottom: 0; }
  .shade {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    box-shadow: inset 0 28px 36px rgba(0,0,0,0.28), inset 0 -22px 28px rgba(0,0,0,0.34);
  }

  @media (max-width: 440px) {
    .lane { top: 8%; bottom: 14%; }
    .lip { height: 5px; }
    .taxonomy-control { top: 8px; left: 8px; gap: 2px; padding: 3px; }
    .taxonomy-title { display: none; }
    .taxonomy-control button { padding: 5px 6px; font-size: 10px; }
    .active-project { top: auto; bottom: 20%; max-width: calc(100% - 24px); overflow: hidden; }
    .chapter-marker { width: 96px; min-height: 72px; padding: 0 6px 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { will-change: auto; }
  }

  .counter.is-flat { perspective: none; }
  .counter.is-flat .well { transform: none; }

  .belt-panel {
    position: fixed;
    z-index: 40;
    right: 16px;
    bottom: 16px;
    width: min(260px, calc(100vw - 32px));
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: var(--blue);
    border: 1px solid var(--blue);
    font-family: var(--grotesk);
    font-size: 12px;
    line-height: 1.3;
  }
  .belt-panel[hidden] { display: none; }
  .belt-panel h2 {
    margin: 0;
    padding-right: 52px;
    font-size: 14px;
    font-weight: 400;
  }
  .belt-panel .hint { margin: 4px 0 0; }
  .belt-panel .close {
    position: absolute;
    top: 8px;
    right: 8px;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    cursor: pointer;
    padding: 2px 4px;
  }
  .belt-panel label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .belt-panel label.row { display: block; margin-top: 12px; }
  .belt-panel label.row span { display: flex; justify-content: space-between; gap: 8px; }
  .belt-panel b { font-weight: 400; }
  .belt-panel input { accent-color: var(--blue); }
  .belt-panel input[type="range"] {
    display: block;
    width: 100%;
    margin: 4px 0 0;
  }
  .belt-panel .copy-json {
    width: 100%; margin-top: 14px; padding: 8px;
    border: 1px solid currentColor; background: #434343;
    color: #8CC88C; font: inherit; cursor: pointer;
  }
  .belt-panel .json-fallback { width: 100%; height: 160px; margin-top: 8px; font: 11px/1.4 monospace; }

  /* Case narrative is laid over the belt, keeping titles on one common baseline. */
  .story-layer { position: fixed; inset: 0; z-index: 4; pointer-events: none; --title-top: clamp(190px, 36vh, 420px); }
  .story-scene { position: absolute; inset: 0; overflow: hidden; }
  .story-scene[hidden] { display: none; }
  .story-title { position: absolute; top: var(--title-top); left: 0; margin: 0; width: 50%; padding-right: 20px; font: 400 clamp(12px, 1.05vw, 18px)/1.3 var(--grotesk); color: var(--blue); text-decoration: underline; text-underline-offset: 3px; will-change: transform; }
  .story-title small { display: block; margin-bottom: 5px; font-size: 10px; text-decoration: none; opacity: .65; }
  .story-card { position: absolute; left: 0; bottom: 24px; margin: 0; height: calc((100% - var(--title-top) - 78px) * var(--card-height)); max-width: 68vw; width: max-content; box-shadow: 0 5px 9px #0005, 0 1px 2px #0008; will-change: transform; }
  .story-card img { display: block; height: 100%; width: auto; max-width: 68vw; object-fit: contain; pointer-events: none; }
  .story-placeholder { width: min(36vw, 470px); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: #343834; border: 1px solid #8cc88c55; color: var(--blue); font: 24px/1.1 var(--grotesk); }
  .story-placeholder small { font-size: 11px; opacity: .65; }
  .belt-panel select { width: 100%; margin-top: 5px; padding: 6px; background: #434343; color: #8cc88c; border: 1px solid #888; font: inherit; }
  @media (max-width: 600px) {
    .story-layer { --title-top: clamp(200px, 34vh, 300px); }
    .story-title { width: 88%; font-size: 12px; }
    .story-card { bottom: 28px; max-width: 82vw; }
    .story-card img { max-width: 82vw; }
    .story-placeholder { width: 65vw; font-size: 20px; }
  }
  .strip-preview { position: absolute; inset: 0; pointer-events: none; }
  .strip-preview > div { position: absolute !important; bottom: var(--strip-baseline, 0px); left: 0; transform-origin: bottom left; }
  .strip-preview p { margin: 0; }
  .strip-preview > div::after { content: ""; flex: 0 0 0; }
  .strip-preview > div > div { height: 100%; pointer-events: auto; }
  .strip-preview img { display: block; }
  .counter.show-case-cursor, .counter.show-case-cursor .strip-preview > div > div { cursor: none; }
  .case-cursor {
    position: fixed;
    top: 0; left: 0; z-index: 39;
    color: var(--blue);
    font: 13px/1.15 var(--grotesk);
    white-space: nowrap;
    pointer-events: none;
  }
  .strip-preview video { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* The alpha video includes empty margins around the jar. */
  .strip-preview .ventonyl-video {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: auto; height: 128%; aspect-ratio: 1512 / 1368;
  }
  .chrome .ig-link { left: auto; right: clamp(125px, 13vw, 210px); }
  .chrome .catalog-entry { left: auto; right: clamp(66px, 6vw, 96px); }
  .chrome .soon { text-decoration: underline; }
  @media (max-width: 700px) {
    .chrome .ig-link, .chrome .catalog-entry, .chrome .soon { position: absolute; top: 12px; bottom: auto; font-size: 11px; height: auto; }
  }
</style>
</head>
<body>
<header class="chrome">
  <img class="wordmark" src="assets/wordmark-8cc88c.svg" alt="Vanök Regular">
  <img class="vanok" src="assets/wordmark-vanok-ui-8cc88c.svg" alt="">
  <img class="regular" src="assets/wordmark-regular-ui-8cc88c.svg" alt="">
  <img class="lettering lettering-1" src="design/stub/wordmark-8a7e59.svg" alt="">

  var rubber = document.getElementById('rubber');
  var track = document.getElementById('track');
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CASES = [
    {name: 'SALUKI EUPHORIA', title: 'Graphics, typography, font for the album SALUKI EUPHORIA', images: ['poster-15.webp', 'shot-2215.webp', 'poster-09.webp']},
    {name: 'SALUKI WILD EA$T', title: 'Wild Ea$t album identity for SALUKI', images: ['we.webp', 'shot-2230.webp', 'photo-1121.webp']},
    {name: 'KAIK', title: 'Creative direction, art direction, design for Kaik — playground for graphic designers', images: ['kaik-photo.webp', 'kaik-1.webp', 'kaik-2.webp', 'kaik-3.webp']},
    {name: 'KARNAVAL RECORDS', title: '2 years of collaboration in art direction and print design for Karnaval Records', images: []},
    {name: 'GLUKOZA', title: 'Identity, font, cover for Glukoza', images: ['glu-poster.webp', 'glu-artbook.webp', 'glu-0115.webp', 'glu-0118.webp']},
    {name: 'SUPERMETAL', title: 'Identity for creative agency SUPERMETAL', images: []},
    {name: 'FEDUK', title: 'Font, posters and graphics for top tier Russian artist — Feduk', images: ['feduk-12.webp', 'feduk-shirt.webp', 'feduk-04.webp', 'feduk-09.webp']},
    {name: 'SUB URBAN', title: 'Titles and graphics for Sub Urban', images: ['sub-08.webp', 'sub-06.webp', 'sub-04.webp', 'sub-02.webp']},
    {name: 'LA POTTER', title: 'Design for La Potter', images: []},
    {name: 'SAUD', title: 'Design for Saud', images: []}
  ];
  var layer = document.createElement('div');
  layer.className = 'story-layer';
  layer.hidden = true;
  layer.setAttribute('aria-label', 'Portfolio cases');
  document.body.appendChild(layer);
  var scenes = [];
  var total = 0;
  CASES.forEach(function (item, caseIndex) {
    var scene = document.createElement('section');
    scene.className = 'story-scene';
    scene.setAttribute('aria-label', item.title);
    var title = document.createElement('h2');
    title.className = 'story-title';
    var number = document.createElement('small');
    number.textContent = String(caseIndex + 1).padStart(2, '0') + ' / 10';
    title.appendChild(number);
    title.appendChild(document.createTextNode(item.title));
    scene.appendChild(title);
    var cards = [];
    var images = item.images.length ? item.images : [null, null, null];
    images.slice(0, 20).forEach(function (file, index) {
      var card = document.createElement('figure');
      card.className = 'story-card';
      card.style.setProperty('--card-height', [1, .72, .48, .84][index % 4]);
      card.style.zIndex = index + 1;
      if (file) {
        var img = document.createElement('img');
        img.src = 'design/board/' + file;
        img.alt = item.name + ' — ' + (index + 1);
        img.draggable = false;
        img.addEventListener('load', paint);
        card.appendChild(img);
      } else {
        card.classList.add('story-placeholder');
        var label = document.createElement('span');
        label.textContent = item.name;
        var note = document.createElement('small');
        note.textContent = 'Место для материала ' + (index + 1) + ' / 3';
        card.append(label, note);
      }
      scene.appendChild(card);
      cards.push(card);
    });
    layer.appendChild(scene);
    var duration = 1.1 + cards.length * .68 + 1.35;
    scenes.push({el: scene, title: title, cards: cards, start: total, duration: duration});
    total += duration - .75;
  });
  total += .75;
  var strip = document.createElement('div');
  strip.className = 'strip-preview';
  var stripTemplate = document.getElementById('figma-strip');
  strip.appendChild(stripTemplate.content.cloneNode(true));
  var duplicate = strip.firstElementChild.cloneNode(true);
  duplicate.setAttribute('aria-hidden', 'true');
  strip.appendChild(duplicate);
  rubber.parentNode.appendChild(strip);
  var stripVideos = Array.from(strip.querySelectorAll('video'));
  function playStripVideos() {
    stripVideos.forEach(function (video) {
      if (video.paused) video.play().catch(function () {});
    });
  }
  playStripVideos();
  window.addEventListener('pointerdown', playStripVideos, { once: true });
  window.addEventListener('keydown', playStripVideos, { once: true });
  var stripScale = 1.5;
  var pointerY = null;
  var pointerX = null;
  var caseCursor = document.createElement('span');
  caseCursor.className = 'case-cursor';
  caseCursor.textContent = 'View case';
  caseCursor.hidden = true;
  caseCursor.setAttribute('aria-hidden', 'true');
  document.body.appendChild(caseCursor);

  function updateCaseCursor() {
    // The cursor also sets the top edge, so sample just inside the strip.
    var hit = pointerX === null ? null : document.elementFromPoint(pointerX, pointerY);
    if (hit && counter.contains(hit) && !hit.closest('.strip-preview')) {
      hit = document.elementFromPoint(pointerX, pointerY + 2);
    }
    var overCase = Boolean(!grab && hit && hit.closest('.strip-preview > div > div'));
    counter.classList.toggle('show-case-cursor', overCase);
    caseCursor.hidden = !overCase;
    if (overCase) {
      var x = Math.min(pointerX + 12, innerWidth - caseCursor.offsetWidth - 4);
      var y = Math.min(pointerY + 12, innerHeight - caseCursor.offsetHeight - 4);
      caseCursor.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    }
  }
  function hideCaseCursor() {
    pointerX = null;
    updateCaseCursor();
  }
  document.documentElement.addEventListener('pointerleave', hideCaseCursor);
  window.addEventListener('blur', hideCaseCursor);
  var scaleAnchor = (counter.clientWidth || innerWidth) / 2;
  var projection;
  var stripLayoutWidth = strip.firstElementChild.offsetWidth;
  var stripPhase = -scaleAnchor / stripScale;
  var previousBeltDistance = 0;
  var depthMarkers = [0, 400, 800].map(function (height) {
    var marker = document.createElement('span');
    marker.style.cssText = 'position:absolute;left:0;width:0;height:0;bottom:' + height + 'px';
    strip.appendChild(marker);
    return marker;
  });

  var rightMarker = depthMarkers[0].cloneNode();
  rightMarker.style.left = '100%';
  strip.appendChild(rightMarker);
  var baselineLeft;
  var baselineWidth;

  function measureProjection() {
    var screenY = depthMarkers.map(function (marker) {
      return marker.getBoundingClientRect().top;
    });
    var first = screenY[1] - screenY[0];
    var second = screenY[2] - screenY[0];
    // Perspective maps distance along the belt to a fractional linear function.
    var curvature = (2 * first - second) / (2 * (second - first));
    return { origin: screenY[0], rate: first * (1 + curvature), curvature: curvature };
  }

  function heightAtY(y, mapping) {
    var delta = y - mapping.origin;
    return delta / (mapping.rate - mapping.curvature * delta);
  }

  function updateStripProjection() {
    var wellProjection = measureProjection();
    var baseline = heightAtY(innerHeight, wellProjection);
    strip.style.setProperty('--strip-baseline', (baseline * 400) + 'px');
    depthMarkers.forEach(function (marker, index) {
      marker.style.bottom = ((baseline + index) * 400) + 'px';
    });
    projection = measureProjection();
    rightMarker.style.bottom = (baseline * 400) + 'px';
    baselineLeft = depthMarkers[0].getBoundingClientRect().left;
    baselineWidth = rightMarker.getBoundingClientRect().left - baselineLeft;
    depthMarkers.forEach(function (marker, index) {
      marker.style.bottom = (index * 400) + 'px';
    });
    if (pointerX !== null) applyPointerScale();
  }

  function applyPointerScale() {
    var anchor = (pointerX - baselineLeft) / baselineWidth * strip.clientWidth;
    if (stripScale > 0) stripPhase += (scaleAnchor - anchor) / stripScale;
    scaleAnchor = anchor;
    stripScale = Math.max(0, heightAtY(pointerY, projection));
  }

  window.addEventListener('pointermove', function (event) {
    if (event.pointerType !== 'mouse') return;
    if (event.target.closest('.belt-panel')) {
      hideCaseCursor();
      return;
    }
    pointerX = event.clientX;
    pointerY = event.clientY;
    applyPointerScale();
    paint();
  });
  var position = 0;
  var targetPosition = 0;
  var grab = null;
  var last = performance.now();
  var activeCase = -1;
  var caseSelect = document.getElementById('story-case');
  CASES.forEach(function (item, index) {
    var option = document.createElement('option');
    option.value = index;
    option.textContent = String(index + 1).padStart(2, '0') + ' — ' + item.name;
    caseSelect.appendChild(option);
  });
  function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
  function setPosition(value, immediate) {
    targetPosition = value;
    if (immediate || reduce) position = targetPosition;
    paint();
  }
  function paint() {
    var width = counter.clientWidth || innerWidth;
    var distance = position * width * .3;
    var scale = stripScale;
    var stripWidth = stripLayoutWidth * scale;
    stripPhase = (stripPhase + (distance - previousBeltDistance) / Math.max(scale, .01)) % stripLayoutWidth;
    previousBeltDistance = distance;
    strip.style.visibility = scale ? '' : 'hidden';
    if (stripWidth) {
      var left = scaleAnchor + stripPhase * scale;
      var offset = ((left % stripWidth) + stripWidth) % stripWidth;
      [strip.firstElementChild, duplicate].forEach(function (image, index) {
        image.style.transform = 'translate3d(' + (offset - index * stripWidth) + 'px,0,0) scale(' + scale + ')';
      });
    }
    rubber.style.setProperty('--belt-offset', distance.toFixed(2) + 'px');
    updateCaseCursor();
  }
  function sizePictures() { paint(); }
  function layout() { paint(); }
  function applyBelt() {
    var n = Number(beltHeight.value);
    counter.style.height = Math.max(1, Math.round(stage.clientHeight * n / 100)) + 'px';
    beltHeightVal.textContent = n + '%';
    updateStripProjection();
    paint();
  }
  function applyTilt() {
    var deg = Number(beltTilt.value);
    root.style.setProperty('--tilt', deg + 'deg');
    root.style.setProperty('--tilt-scale', (1 + Math.abs(deg) * (.16 / 13)).toFixed(3));
    beltTiltVal.textContent = deg + '°';
    updateStripProjection();
    paint();
  }
  caseSelect.addEventListener('change', function () {
    setPosition(scenes[Number(caseSelect.value)].start + .65, true);
  });
  window.addEventListener('wheel', function (e) {
    if (e.target.closest && e.target.closest('.belt-panel')) return;
    if (e.ctrlKey) return;
    e.preventDefault();
    var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    var unit = e.deltaMode === 1 ? 18 : e.deltaMode === 2 ? counter.clientWidth : 1;
    setPosition(targetPosition + delta * unit / Math.max(500, counter.clientWidth * .7));
  }, {passive: false});
  counter.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.target.closest('a, button, input, select')) return;
    counter.setPointerCapture(e.pointerId);
    grab = {id: e.pointerId, x: e.clientX};
    counter.classList.add('is-grab');
  });
  counter.addEventListener('pointermove', function (e) {
    if (!grab || grab.id !== e.pointerId) return;
    var deltaX = e.clientX - grab.x;
    grab.x = e.clientX;
    setPosition(targetPosition + deltaX / Math.max(350, counter.clientWidth * .7), true);
  });
  function endGrab() { grab = null; counter.classList.remove('is-grab'); }
  counter.addEventListener('pointerup', endGrab);
  counter.addEventListener('pointercancel', endGrab);
  window.addEventListener('keydown', function (e) {
    if (e.target.closest('input, select, textarea, button') || e.metaKey || e.ctrlKey || e.altKey) return;
    var step = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? .55 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -.55 : 0;
    if (step) { e.preventDefault(); setPosition(targetPosition + step); }
    if (e.key === 'Home') { e.preventDefault(); setPosition(0); }
    if (e.key === 'End') { e.preventDefault(); setPosition(total - .3); }
  });
  function frame(now) {
    var dt = Math.min(.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!reduce) targetPosition += dt * .11;
    position += (targetPosition - position) * (reduce ? 1 : 1 - Math.exp(-12 * dt));
    if (Math.abs(targetPosition - position) < .0001) position = targetPosition;
    paint();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () { applyBelt(); });
  applyBelt();
  requestAnimationFrame(frame);

  var panel = document.getElementById('belt-panel');
  var depth = document.getElementById('belt-depth');
  function applyDepth() {
    counter.classList.toggle('has-depth', depth.checked);
  }
  depth.addEventListener('change', applyDepth);
  applyDepth();
  panel.querySelectorAll('input[name="belt-material"]').forEach(function (input) {
    input.addEventListener('change', function () {
      if (input.checked) rubber.dataset.material = input.value;
    });
  });
  var perspective = document.getElementById('belt-perspective');
  panel.querySelector('.copy-json').addEventListener('click', async function () {
    var root = document.documentElement;
    var json = JSON.stringify({
      version: 1,
      page: 'belt',
      theme: root.dataset.theme || '0',
      background: getComputedStyle(rubber).backgroundColor,
      letteringColor: getComputedStyle(root).getPropertyValue('--blue').trim(),
      material: rubber.dataset.material || 'original',
      depth: depth.checked,
      perspective: perspective.checked,
      tiltDegrees: Number(beltTilt.value),
      heightPercent: Number(beltHeight.value),
      caseIndex: activeCase + 1,
      storyPosition: Number(position.toFixed(3))
    }, null, 2);
    var status = document.getElementById('copy-status');
    var fallback = panel.querySelector('.json-fallback');
    fallback.value = json;
    try {
      await navigator.clipboard.writeText(json);
      fallback.hidden = true;
      status.textContent = 'Скопировано — вставь в чат.';
    } catch (error) {
      fallback.hidden = false;
      fallback.focus();
      fallback.select();
      status.textContent = 'Нажми ⌘C / Ctrl+C и вставь в чат.';
    }
  });
  function applyPerspective() {
    counter.classList.toggle('is-flat', !perspective.checked);
    updateStripProjection();
    paint();
  }
  perspective.addEventListener('change', applyPerspective);
  beltHeight.addEventListener('input', applyBelt);
  beltTilt.addEventListener('input', applyTilt);
  applyTilt();
  panel.querySelector('.close').addEventListener('click', function () {
    panel.hidden = true;
  });
  window.addEventListener('keydown', function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Escape') {
      panel.hidden = true;
      return;
    }
    var tag = (e.target && e.target.tagName) || '';
    var type = ((e.target && e.target.type) || '').toLowerCase();
    if (tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (tag === 'INPUT' && type !== 'checkbox' && type !== 'radio') return;
    if (e.code !== 'KeyG') return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  });
})();
</script>
